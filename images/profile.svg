<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circular badge -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="200" cy="180" r="145" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 12" opacity="0.4"/>
  <circle cx="200" cy="180" r="120" fill="url(#glowGrad)"/>

  <!-- Code decorative elements -->
  <rect x="40" y="50" width="70" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="52" y="66" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">&lt;coder/&gt;</text>

  <rect x="290" y="60" width="70" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="304" y="76" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">{ dev: IT }</text>

  <rect x="50" y="320" width="80" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="336" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AI + UI/UX</text>

  <rect x="280" y="315" width="75" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="294" y="331" fill="#ec4899" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cebu, PH</text>

  <!-- Developer Silhouette / Illustration -->
  <g filter="url(#shadow)">
    <!-- Shoulders / Body -->
    <path d="M110 320 C110 250, 140 235, 200 235 C260 235, 290 250, 290 320 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <!-- Collar / Hoodie V -->
    <path d="M175 235 L200 270 L225 235 Z" fill="#334155"/>
    <path d="M200 270 L200 320" stroke="#475569" stroke-width="2"/>

    <!-- Head / Face -->
    <ellipse cx="200" cy="165" rx="52" ry="62" fill="#fed7aa"/>
    <!-- Neck -->
    <rect x="186" y="215" width="28" height="25" fill="#fcd34d" opacity="0.8"/>

    <!-- Hair -->
    <path d="M148 160 C145 110, 180 100, 210 102 C240 104, 255 125, 252 160 C245 130, 220 115, 195 116 C170 117, 155 135, 148 160 Z" fill="#1e1b4b"/>
    <path d="M150 145 C155 120, 180 110, 225 115 C240 117, 250 128, 252 142 C240 128, 215 122, 190 125 C165 128, 155 138, 150 145 Z" fill="#312e81"/>

    <!-- Glasses -->
    <rect x="162" y="152" width="30" height="20" rx="5" fill="none" stroke="#0f172a" stroke-width="3.5"/>
    <rect x="208" y="152" width="30" height="20" rx="5" fill="none" stroke="#0f172a" stroke-width="3.5"/>
    <line x1="192" y1="162" x2="208" y2="162" stroke="#0f172a" stroke-width="3.5"/>
    <!-- Lens reflection -->
    <line x1="166" y1="156" x2="176" y2="168" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="212" y1="156" x2="222" y2="168" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Friendly smile & nose -->
    <path d="M198 172 L196 182 L202 182" fill="none" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
    <path d="M185 195 Q200 206 215 195" fill="none" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Laptop / Desk Overlay -->
  <g>
    <rect x="145" y="295" width="110" height="15" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <!-- Screen glow -->
    <polygon points="152,295 160,250 240,250 248,295" fill="url(#accentGrad)" opacity="0.25"/>
    <!-- Monogram badge -->
    <circle cx="200" cy="355" r="22" fill="#4f46e5" stroke="#818cf8" stroke-width="2"/>
    <text x="200" y="362" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">KB</text>
  </g>
</svg>
