<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="sdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#sdBg)"/>

  <!-- Top App Navigation Bar -->
  <rect x="25" y="20" width="550" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <circle cx="48" cy="41" r="5" fill="#ef4444"/>
  <circle cx="64" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="80" cy="41" r="5" fill="#10b981"/>
  <text x="105" y="46" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SafeDrive: Records Management System</text>
  
  <rect x="420" y="28" width="140" height="26" rx="13" fill="#1e3a5f" stroke="#0284c7" stroke-width="1"/>
  <text x="490" y="45" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">ACTIVITY PROJECT</text>

  <!-- Metric Badges Row -->
  <g transform="translate(30, 75)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="168" height="60" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
    <text x="16" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REGISTERED VEHICLES</text>
    <text x="16" y="48" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">1,842</text>
    <circle cx="140" cy="30" r="14" fill="#0369a1" opacity="0.3"/>
    <path d="M135 30 L139 34 L146 26" stroke="#38bdf8" stroke-width="2" fill="none"/>

    <!-- Stat 2 -->
    <rect x="186" y="0" width="168" height="60" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
    <text x="202" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ACTIVE COMPLIANCE</text>
    <text x="202" y="48" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="800">97.4%</text>
    <circle cx="326" cy="30" r="14" fill="#047857" opacity="0.3"/>
    <text x="326" y="34" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">↑</text>

    <!-- Stat 3 -->
    <rect x="372" y="0" width="168" height="60" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
    <text x="388" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">PENDING AUDITS</text>
    <text x="388" y="48" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="20" font-weight="800">12</text>
    <circle cx="512" cy="30" r="14" fill="#b45309" opacity="0.3"/>
    <text x="512" y="34" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">!</text>
  </g>

  <!-- Records Data Table View -->
  <g transform="translate(30, 150)">
    <rect width="540" height="180" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    
    <!-- Table Header -->
    <rect x="12" y="12" width="516" height="30" rx="6" fill="#1e293b"/>
    <text x="26" y="31" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">PLATE NO.</text>
    <text x="120" y="31" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">DRIVER NAME</text>
    <text x="250" y="31" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">CATEGORY</text>
    <text x="370" y="31" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STATUS</text>
    <text x="475" y="31" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ACTION</text>

    <!-- Row 1 -->
    <line x1="12" y1="52" x2="528" y2="52" stroke="#1f2937" stroke-width="1"/>
    <text x="26" y="72" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="600">CEB-4821</text>
    <text x="120" y="72" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">R. Villamor</text>
    <text x="250" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Commercial</text>
    <rect x="365" y="58" width="65" height="20" rx="10" fill="#064e3b"/>
    <text x="397" y="72" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Verified</text>
    <text x="485" y="72" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">View →</text>

    <!-- Row 2 -->
    <line x1="12" y1="90" x2="528" y2="90" stroke="#1f2937" stroke-width="1"/>
    <text x="26" y="110" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="600">QUI-1092</text>
    <text x="120" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">M. Santos</text>
    <text x="250" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Private Car</text>
    <rect x="365" y="96" width="65" height="20" rx="10" fill="#78350f"/>
    <text x="397" y="110" text-anchor="middle" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Pending</text>
    <text x="485" y="110" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">View →</text>

    <!-- Row 3 -->
    <line x1="12" y1="128" x2="528" y2="128" stroke="#1f2937" stroke-width="1"/>
    <text x="26" y="148" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="600">DGT-7734</text>
    <text x="120" y="148" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">K. Bautista</text>
    <text x="250" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Fleet Transit</text>
    <rect x="365" y="134" width="65" height="20" rx="10" fill="#064e3b"/>
    <text x="397" y="148" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Verified</text>
    <text x="485" y="148" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">View →</text>
  </g>
</svg>
